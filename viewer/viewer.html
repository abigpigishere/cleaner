<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>空间浏览 · Cleaner</title><link rel="stylesheet" href="viewer.css"><script src="treemap.js" defer></script><script src="viewer.js" defer></script></head>
<body><header><div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><div><b>Cleaner</b><small>磁盘索引浏览器</small></div></div><div class="target-controls"><label for="driveSelect">扫描位置</label><select id="driveSelect" aria-label="选择磁盘"></select><input id="targetPath" aria-label="扫描目标路径" placeholder="整盘，或输入本地文件夹路径"><button id="pickFolder">选择文件夹…</button><button id="startScan" class="primary">开始扫描</button></div><span class="pill">只读</span></header>
<main><section class="summary"><div class="intro"><span class="eyebrow">DISK EXPLORER</span><h1 id="heading">C: 空间浏览</h1></div><div class="stats" id="stats"></div></section><div class="notice hidden" id="notice"></div>
<section class="data-deck" id="dataDeck"><section class="workspace"><aside class="treepanel"><div class="panel-title">目录树 <span id="treeCount"></span></div><div id="tree" class="tree" tabindex="0" aria-label="可滚动目录树"></div></aside>
<section class="content"><div class="toolbar"><div class="tabs"><button id="treeTab" class="active">目录查看</button><button id="filesTab">全部文件</button></div><label>排序<select id="metric"><option value="allocated">磁盘占用</option><option value="logical">逻辑大小</option></select></label></div>
<div class="location"><button id="home" title="返回根目录">⌂</button><span id="location">C:\</span><button id="back" title="返回上级">↑ 上级</button></div>
<form id="searchForm" class="search hidden"><input id="search" placeholder="按文件名搜索全部文件，如 .dll、pagefile" maxlength="160" aria-label="搜索文件名"><button>搜索</button></form>
<div class="table-wrap" tabindex="0" aria-label="可滚动文件列表"><table><thead><tr><th>名称 / 路径</th><th>占比</th><th>逻辑大小</th><th>磁盘占用</th><th>状态</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty hidden"></div></div>
<footer class="pagination"><span id="pageInfo">准备中…</span><div><button id="prev">上一页</button><button id="next">下一页</button></div></footer></section>
<aside class="inspector"><div class="panel-title">所选项目</div><div id="details"><div class="detail-empty"><span class="icon folder big"></span><p>选择文件或目录<br>查看完整路径与大小信息</p></div></div></aside></section>
<div id="mapResizer" class="map-resizer" role="separator" aria-label="调整矩形图高度" aria-orientation="horizontal" tabindex="0"><span></span></div>
<section class="treemap-panel" id="mapPanel"><div class="map-toolbar"><div class="map-heading"><b>空间矩形图</b><span id="mapPath">读取中…</span></div><div class="map-actions"><button id="mapUp" title="矩形图返回上级">↑ 上级</button><button id="mapReset" title="显示整个扫描范围">全景</button></div></div>
<div id="treemap" class="treemap-stage" aria-label="按大小绘制的空间矩形图"></div><div class="map-footer"><div class="map-legend" id="mapLegend"></div><span id="mapCaption">单击进入 · 右键更多操作</span></div></section></section>
<section class="scan-progress" aria-live="polite"><div class="progress-caption"><b id="scanPhase">就绪</b><span id="scanElapsed">未开始新的扫描</span></div><progress id="scanProgress" max="100" value="0" aria-label="扫描进度"></progress><div class="progress-bottom"><span id="scanRecords">选择磁盘或文件夹后开始，只读扫描。</span><span id="indexTime"></span></div></section><footer class="footnote">大小按 NTFS 已分配簇统计；硬链接只在一个文件夹中计入。此页面只读，不提供删除操作。</footer></main>
<div id="mapTooltip" class="map-tooltip hidden" role="tooltip"></div><div id="contextMenu" class="context-menu hidden" role="menu" aria-label="文件操作"></div><div id="status" role="status" class="status hidden"></div></body></html>
